name: Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills-wiring:
    name: Workflow skills wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify workflow skills are wired correctly
        run: |
          cp repo.env.example repo.env
          .agents/skills/ci-safety/scripts/check-wiring
